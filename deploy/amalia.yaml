apiVersion: apps/v1
kind: Deployment
metadata:
  name: amalia-inference
  namespace: ai-prod
  labels:
    app: amalia-inference
    workload-type: ai-inference
    ai-act.risk-class: high
    ai-act.system-id: AIS-001-amalia
  annotations:
    ai-act.approved-by: compliance@itlusions.nl
    ai-act.approval-ticket: CHG-2026-0412
    ai-act.kill-switch-endpoint: https://amalia.itlusions.nl/admin/halt
    ai-act.disclosure-url: https://itlusions.nl/ai-transparency/amalia
    ai-act.human-interaction: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amalia-inference
  template:
    metadata:
      labels:
        app: amalia-inference
        workload-type: ai-inference
        ai-act.risk-class: high
        ai-act.system-id: AIS-001-amalia
      annotations:
        spiffe.io/spiffe-id: spiffe://itlusions.nl/ai/amalia/inference
    spec:
      nodeSelector:
        node-attestation: tpm-verified
      containers:
        - name: inference
          image: registry.itlusions.nl/models/amalia:v2.3.1
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "4", memory: 8Gi }
